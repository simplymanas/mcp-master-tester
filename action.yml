name: MCP Master Tester
description: Lint an MCP server's tools, smoke-test the read-only ones, catch breaking changes, and check which tool a model picks.
author: simplymanas
branding:
  icon: check-circle
  color: blue

inputs:
  command:
    description: >-
      Command that starts a stdio server, for example "node dist/index.js". It is split on spaces
      and run without a shell, so an argument that contains a space needs a wrapper script.
      Give this or url.
    required: false
  url:
    description: URL of a Streamable HTTP server. Give this or command.
    required: false
  sse:
    description: Use the legacy SSE transport for url.
    required: false
    default: 'false'
  headers:
    description: 'HTTP headers for url, one "Name: value" per line. Pass secrets from the secrets context.'
    required: false
  env:
    description: >-
      Environment variables for a stdio server, one KEY=VALUE per line. The server does not see
      the workflow's environment except PATH, HOME and a few others, so pass what it needs here.
    required: false
  cwd:
    description: Working directory for a stdio server. Defaults to the workspace.
    required: false
  checks:
    description: >-
      Which checks to run, comma-separated: lint, smoke, diff, eval. Left empty, it runs lint and
      smoke, plus diff when the lockfile exists, plus eval when the cases file exists and
      anthropic-api-key is set.
    required: false
    default: ''
  lint-fail-on:
    description: Fail on lint findings at this level or worse. error, warn, info or never.
    required: false
    default: error
  smoke-fail-on:
    description: >-
      Fail the smoke test on fail, warn, skip (a tool went untested and you didn't leave it out
      with skip or tools), or never.
    required: false
    default: fail
  lockfile:
    description: Tool lockfile that diff compares with. Create it with "npx mcp-master-tester snapshot" and commit it.
    required: false
    default: mcp-tools.lock.json
  diff-fail-on:
    description: Fail diff on breaking (default), warn, info, or never.
    required: false
    default: breaking
  tools:
    description: >-
      Smoke-test only these tools, comma- or newline-separated, whether or not they are marked
      read-only. The safest way to choose what runs.
    required: false
  skip:
    description: Tools the smoke test leaves out, comma- or newline-separated.
    required: false
  all:
    description: Also smoke-test tools that aren't clearly read-only. They may change data.
    required: false
    default: 'false'
  args:
    description: 'JSON file of smoke-test arguments: { "tool_name": { "param": "value" } }.'
    required: false
  eval-cases:
    description: >-
      Tool-selection test cases for eval: requests a user might make and the tool each should lead
      to, as JSON. See "mcp-master-tester eval --help".
    required: false
    default: mcp-evals.json
  anthropic-api-key:
    description: >-
      Anthropic API key for eval, from the secrets context. eval sends each case to the model with
      your tool list; it calls nothing on the server. Each case is one API request, billed to this key.
    required: false
  eval-model:
    description: Model for eval. Defaults to "model" in the cases file, else claude-opus-5-5.
    required: false
  eval-effort:
    description: Effort for the eval model (low, medium, high, xhigh or max). Defaults to the model's own.
    required: false
  eval-pass-rate:
    description: Pass eval when at least this percentage of cases pass. Models vary a little from run to run.
    required: false
    default: '100'
  eval-fail-on:
    description: Fail eval below eval-pass-rate (fail), or never.
    required: false
    default: fail
  timeout:
    description: Milliseconds to wait for connecting, listing tools, or one tool call.
    required: false
    default: '30000'

outputs:
  lint:
    description: passed, failed, error (couldn't run) or skipped
    value: ${{ steps.run.outputs.lint }}
  smoke:
    description: passed, failed, error (couldn't run) or skipped
    value: ${{ steps.run.outputs.smoke }}
  diff:
    description: passed, failed, error (couldn't run) or skipped
    value: ${{ steps.run.outputs.diff }}
  eval:
    description: passed, failed, error (couldn't run) or skipped
    value: ${{ steps.run.outputs.eval }}

runs:
  using: composite
  steps:
    - name: Install MCP Master Tester
      shell: bash
      run: cd "$GITHUB_ACTION_PATH" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund --loglevel=error
    # eval needs the Anthropic SDK, an optional peer that the install above leaves out. The full
    # install adds it (pinned by the lockfile) along with the test packages; only when eval may run.
    - name: Install the Anthropic SDK for eval
      if: contains(inputs.checks, 'eval') || (inputs.checks == '' && inputs.anthropic-api-key != '')
      shell: bash
      run: cd "$GITHUB_ACTION_PATH" && npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
    - name: Run checks
      id: run
      shell: bash
      # Inputs reach the script only as environment variables, never pasted into the shell line.
      env:
        MMT_COMMAND: ${{ inputs.command }}
        MMT_URL: ${{ inputs.url }}
        MMT_SSE: ${{ inputs.sse }}
        MMT_HEADERS: ${{ inputs.headers }}
        MMT_ENV: ${{ inputs.env }}
        MMT_CWD: ${{ inputs.cwd }}
        MMT_CHECKS: ${{ inputs.checks }}
        MMT_LINT_FAIL_ON: ${{ inputs.lint-fail-on }}
        MMT_SMOKE_FAIL_ON: ${{ inputs.smoke-fail-on }}
        MMT_LOCKFILE: ${{ inputs.lockfile }}
        MMT_DIFF_FAIL_ON: ${{ inputs.diff-fail-on }}
        MMT_TOOLS: ${{ inputs.tools }}
        MMT_SKIP: ${{ inputs.skip }}
        MMT_ALL: ${{ inputs.all }}
        MMT_ARGS: ${{ inputs.args }}
        MMT_EVAL_CASES: ${{ inputs.eval-cases }}
        MMT_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        MMT_EVAL_MODEL: ${{ inputs.eval-model }}
        MMT_EVAL_EFFORT: ${{ inputs.eval-effort }}
        MMT_EVAL_PASS_RATE: ${{ inputs.eval-pass-rate }}
        MMT_EVAL_FAIL_ON: ${{ inputs.eval-fail-on }}
        MMT_TIMEOUT: ${{ inputs.timeout }}
      run: node "$GITHUB_ACTION_PATH/action/run.mjs"
