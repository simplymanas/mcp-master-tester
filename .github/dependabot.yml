# Keeps the lockfile and the CI actions current. One grouped pull request a week per ecosystem,
# so updates don't flood the repo. Security fixes still open their own pull request right away.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
